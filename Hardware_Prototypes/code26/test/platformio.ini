[platformio]
default_envs = beetle_c6_diagnostic

[env:sht45]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  BH1750
  adafruit/Adafruit MPU6050@^2.0.0
  mikalhart/TinyGPSPlus@^1.0.1
  sensirion/arduino-sht@^1.0.0
build_src_filter = +<sht45_example.cpp>

[env:bh1750]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  BH1750
  adafruit/Adafruit MPU6050@^2.0.0
  mikalhart/TinyGPSPlus@^1.0.1
  sensirion/arduino-sht@^1.0.0
build_src_filter = +<bh1750_example.ino>

[env:mpu6050]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  BH1750
  adafruit/Adafruit MPU6050@^2.0.0
  mikalhart/TinyGPSPlus@^1.0.1
  sensirion/arduino-sht@^1.0.0
build_src_filter = +<mpu6050_example.ino>

[env:neo6m]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  BH1750
  adafruit/Adafruit MPU6050@^2.0.0
  mikalhart/TinyGPSPlus@^1.0.1
  sensirion/arduino-sht@^1.0.0
build_src_filter = +<neo6m_example.ino>

[env:all_sensors]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  BH1750
  adafruit/Adafruit MPU6050@^2.0.0
  mikalhart/TinyGPSPlus@^1.0.1
  sensirion/arduino-sht@^1.0.0
build_src_filter = +<all_sensors_example.cpp>

[env:beetle_c6_diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM37
monitor_port = COM37
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  BH1750
  adafruit/Adafruit MPU6050@^2.0.0
  mikalhart/TinyGPSPlus@^1.0.1
  sensirion/arduino-sht@^1.0.0
build_src_filter = -<*> +<carrier_board_diagnostic.cpp>

