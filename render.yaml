services:
  - type: web
    name: coldchain-unified-portal
    runtime: python
    rootDir: Final_Experiment/5_Unified_FastAPI_Portal
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
